name: Build Stage Timer Installers

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            artifact: Stage-Timer-Windows
          - os: macos-latest
            command: dist:mac
            artifact: Stage-Timer-macOS

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Stage Timer project
        id: locate
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            app_dir='.'
          elif [[ -f stage-timer/package.json ]]; then
            app_dir='stage-timer'
          else
            echo 'ERROR: Cannot find package.json in the repository root or stage-timer/ folder.' >&2
            find . -maxdepth 3 -name package.json -print
            exit 1
          fi
          echo "directory=$app_dir" >> "$GITHUB_OUTPUT"
          echo "Stage Timer directory: $app_dir"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.directory }}
        run: npm install --no-audit --no-fund

      - name: Download bundled fonts
        working-directory: ${{ steps.locate.outputs.directory }}
        run: npm run fonts

      - name: Disable publishing and update metadata
        working-directory: ${{ steps.locate.outputs.directory }}
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build=p.build||{}; p.build.publish=[]; p.build.generateUpdatesFilesForAllChannels=false; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build installer
        working-directory: ${{ steps.locate.outputs.directory }}
        run: npm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.locate.outputs.directory }}/dist/*.exe
            ${{ steps.locate.outputs.directory }}/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
